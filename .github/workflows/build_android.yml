name: Build VibeLive Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🎯 Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Renk ve Kod Hatalarını Otomatik Onar
        run: |
          python3 -c "
          for path, old, new in [
              ('lib/screens/feed/fyp_screen.dart', 'Colors.black82', 'Colors.black87'),
              ('lib/screens/live/live_room_screen.dart', 'Colors.black90', 'Colors.black87'),
              ('lib/constants/app_colors.dart', 'static const Color secondary', 'static const Color gold = Color(0xFFFFD700);\n  static const Color secondary')
          ]:
              try:
                  with open(path, 'r', encoding='utf-8') as f: c = f.read()
                  with open(path, 'w', encoding='utf-8') as f: f.write(c.replace(old, new))
                  print('Fixed:', path)
              except Exception as e:
                  print('Skip:', path, e)
          "
          rm -rf android/
          flutter create --org com.vibelive --project-name vibelive .
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          flutter pub get

      - name: 📱 Doğrudan Telefona Yüklenebilir APK (.apk) Derle
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📦 Google Play App Bundle (.aab) Derle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: ⬆️ Test İçin .apk Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: VibeLive-Test-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: ⬆️ Google Play .aab Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: VibeLive-GooglePlay-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab
