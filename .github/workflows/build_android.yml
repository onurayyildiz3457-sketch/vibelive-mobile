name: Build VibeLive Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🎯 Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Android Yapılandırmasını ve Paketleri Eşitle
        run: |
          rm -rf android/
          cat << 'EOF' > pubspec.yaml
          name: vibelive
          description: "VibeLive - Mobil Canlı Yayın ve Dikey Video Platformu"
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.2.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            http: ^1.2.1
            socket_io_client: ^3.0.0
            google_fonts: ^6.2.1

          flutter:
            uses-material-design: true
          EOF
          flutter create --org com.vibelive --project-name vibelive .
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          flutter pub get

      - name: 📱 Doğrudan Telefona Yüklenebilir APK (.apk) Derle
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📦 Google Play App Bundle (.aab) Derle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: ⬆️ Test İçin .apk Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: VibeLive-Test-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: ⬆️ Google Play .aab Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: VibeLive-GooglePlay-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab
