name: Build VibeLive Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: ☕ Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🎯 Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Kodları ve Android Platform Dosyalarını Eşitle
        run: |
          curl -s -L https://dramakolik.co/vibe-api/vibelive-mobile-app.zip -o app.zip
          unzip -o -q app.zip
          rm -f app.zip
          rm -rf android/
          flutter create --org com.vibelive --project-name vibelive .
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          curl -s -L https://dramakolik.co/vibe-api/patch_manifest.py -o patch_manifest.py
          python3 patch_manifest.py
          rm -f patch_manifest.py
          flutter pub get

      - name: 📱 Doğrudan Telefona Yüklenebilir APK (.apk) Derle
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📦 Google Play App Bundle (.aab) Derle
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: ⬆️ Test İçin .apk Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: VibeLive-Test-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: ⬆️ Google Play .aab Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: VibeLive-GooglePlay-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab
